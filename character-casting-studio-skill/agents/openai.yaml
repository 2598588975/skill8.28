  short_description: Create material-driven photorealistic casting sheets
  default_prompt: Use $character-casting-studio to generate the requested person first, focusing on face, temperament, makeup, hair, clothing, age, identity, and photographic quality. Generate a single character image by default; create a three-view, white-background, or character-breakdown asset only when the user explicitly asks for it.
